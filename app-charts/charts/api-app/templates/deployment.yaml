{{- /* Volumes + init steps from NebuaCloud's Runtime settings (see values.yaml). */}}
{{- $runtime := dict }}
{{- if .Values.runtimeStorage }}
{{- $runtime = .Values.runtimeStorage | b64dec | fromJson }}
{{- end }}
{{- /* A ReadWriteOnce volume attaches to one node only: a new pod on another node
     would wait forever (Multi-Attach), so the old pod has to stop first. */}}
{{- $rwo := false }}
{{- range $runtime.volumes }}
{{- if not .shared }}{{ $rwo = true }}{{ end }}
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}
  labels:
    app: {{ .Release.Name }}
spec:
  replicas: {{ .Values.replicaCount }}
  {{- if .Values.strategy }}
  strategy:
    {{- toYaml .Values.strategy | nindent 4 }}
  {{- else if $rwo }}
  strategy:
    type: Recreate
    rollingUpdate: null
  {{- else }}
  # A new pod replaces an old one only once it is ready: an image that can't be
  # pulled leaves the old pods serving.
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  {{- end }}
  selector:
    matchLabels:
      app: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app: {{ .Release.Name }}
    spec:
      {{- if gt (int .Values.replicaCount) 1 }}
      # One replica per node when there are enough nodes, so losing a node doesn't take them all.
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: {{ .Release.Name }}
      {{- end }}
      {{- if .Values.workerNodesOnly }}
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: node-role.kubernetes.io/control-plane
                    operator: DoesNotExist
                  - key: node-role.kubernetes.io/master
                    operator: DoesNotExist
      {{- end }}
      {{- $hasRegistryToken := and .Values.registry (ne (default "" .Values.registry.token) "") -}}
      {{- $registrySecretName := default (printf "%s-registry-credentials" .Release.Name) .Values.registry.secretName -}}
      {{- if or .Values.imagePullSecrets $hasRegistryToken }}
      imagePullSecrets:
        {{- if $hasRegistryToken }}
        - name: {{ $registrySecretName }}
        {{- end }}
        {{- if .Values.imagePullSecrets }}
        {{- toYaml .Values.imagePullSecrets | nindent 8 }}
        {{- end }}
      {{- end }}
      {{- if .Values.serviceAccount.create }}
      serviceAccountName: {{ .Values.serviceAccount.name | default .Release.Name }}
      {{- end }}
      {{- with $runtime.initSteps }}
      initContainers:
        {{- range $index, $step := . }}
        - name: {{ default (printf "init-%d" (add1 $index)) $step.name | quote }}
          image: {{ $step.image | quote }}
          {{- if $step.command }}
          command: ["sh", "-c", {{ $step.command | quote }}]
          {{- end }}
          {{- with $step.mounts }}
          volumeMounts:
            {{- range . }}
            - name: {{ printf "rv-%s" .volume | quote }}
              mountPath: {{ .mountPath | quote }}
              {{- if .subPath }}
              subPath: {{ .subPath | quote }}
              {{- end }}
            {{- end }}
          {{- end }}
          resources:
            {{- toYaml $.Values.resources | nindent 12 }}
        {{- end }}
      {{- end }}
      containers:
        - name: {{ .Release.Name }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          {{- with .Values.args }}
          args:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          ports:
            - containerPort: {{ .Values.containerPort | default .Values.service.port }}
          {{- $env := dict "NODE_ENV" "production" "ENVIRONMENT" "production" }}
          {{- range .Values.extraEnv }}
          {{- $_ := set $env .name .value }}
          {{- end }}
          env:
            {{- range $name, $value := $env }}
            - name: {{ $name | quote }}
              value: {{ $value | quote }}
            {{- end }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          {{- with $runtime.volumes }}
          volumeMounts:
            {{- range . }}
            - name: {{ printf "rv-%s" .name | quote }}
              mountPath: {{ .mountPath | quote }}
              {{- if .subPath }}
              subPath: {{ .subPath | quote }}
              {{- end }}
              {{- if .readOnly }}
              readOnly: true
              {{- end }}
            {{- end }}
          {{- end }}
          {{- if .Values.readinessProbe.enabled }}
          readinessProbe:
            httpGet:
              path: {{ .Values.readinessProbe.path }}
              port: {{ .Values.containerPort | default .Values.service.port }}
            initialDelaySeconds: {{ .Values.readinessProbe.initialDelaySeconds }}
            periodSeconds: {{ .Values.readinessProbe.periodSeconds }}
            timeoutSeconds: {{ .Values.readinessProbe.timeoutSeconds | default 1 }}
          {{- end }}
          {{- if .Values.livenessProbe.enabled }}
          livenessProbe:
            httpGet:
              path: {{ .Values.livenessProbe.path }}
              port: {{ .Values.containerPort | default .Values.service.port }}
            initialDelaySeconds: {{ .Values.livenessProbe.initialDelaySeconds }}
            periodSeconds: {{ .Values.livenessProbe.periodSeconds }}
            timeoutSeconds: {{ .Values.livenessProbe.timeoutSeconds | default 1 }}
          {{- end }}
      {{- with $runtime.volumes }}
      volumes:
        {{- range . }}
        - name: {{ printf "rv-%s" .name | quote }}
          persistentVolumeClaim:
            claimName: {{ default (printf "%s-%s" (trunc 40 $.Release.Name) .name) .claimName | quote }}
        {{- end }}
      {{- end }}
