apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}
  labels:
    app: {{ .Release.Name }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app: {{ .Release.Name }}
    spec:
      {{- $hasRegistryToken := and .Values.registry (ne (default "" .Values.registry.token) "") -}}
      {{- $registrySecretName := default (printf "%s-registry-credentials" .Release.Name) .Values.registry.secretName -}}
      {{- if or .Values.imagePullSecrets $hasRegistryToken }}
      imagePullSecrets:
        {{- if $hasRegistryToken }}
        - name: {{ $registrySecretName }}
        {{- end }}
        {{- if .Values.imagePullSecrets }}
        {{- toYaml .Values.imagePullSecrets | nindent 8 }}
        {{- end }}
      {{- end }}
      {{- if .Values.serviceAccount.create }}
      serviceAccountName: {{ .Values.serviceAccount.name | default .Release.Name }}
      {{- end }}
      {{- $runtime := dict }}
      {{- if .Values.runtimeStorage }}
      {{- $runtime = .Values.runtimeStorage | b64dec | fromJson }}
      {{- end }}
      {{- with $runtime.initSteps }}
      initContainers:
        {{- range $index, $step := . }}
        - name: {{ default (printf "init-%d" (add1 $index)) $step.name | quote }}
          image: {{ $step.image | quote }}
          {{- if $step.command }}
          command: ["sh", "-c", {{ $step.command | quote }}]
          {{- end }}
          {{- with $step.mounts }}
          volumeMounts:
            {{- range . }}
            - name: {{ printf "rv-%s" .volume | quote }}
              mountPath: {{ .mountPath | quote }}
              {{- if .subPath }}
              subPath: {{ .subPath | quote }}
              {{- end }}
            {{- end }}
          {{- end }}
          resources:
            {{- toYaml $.Values.resources | nindent 12 }}
        {{- end }}
      {{- end }}
      containers:
        - name: {{ .Release.Name }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          {{- with .Values.args }}
          args:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          ports:
            - containerPort: {{ .Values.containerPort | default .Values.service.port }}
          {{- $env := dict "NODE_ENV" "production" "ENVIRONMENT" "production" }}
          {{- range .Values.extraEnv }}
          {{- $_ := set $env .name .value }}
          {{- end }}
          env:
            {{- range $name, $value := $env }}
            - name: {{ $name | quote }}
              value: {{ $value | quote }}
            {{- end }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          {{- with $runtime.volumes }}
          volumeMounts:
            {{- range . }}
            - name: {{ printf "rv-%s" .name | quote }}
              mountPath: {{ .mountPath | quote }}
              {{- if .subPath }}
              subPath: {{ .subPath | quote }}
              {{- end }}
              {{- if .readOnly }}
              readOnly: true
              {{- end }}
            {{- end }}
          {{- end }}
          {{- if .Values.readinessProbe.enabled }}
          readinessProbe:
            httpGet:
              path: {{ .Values.readinessProbe.path }}
              port: {{ .Values.containerPort | default .Values.service.port }}
            initialDelaySeconds: {{ .Values.readinessProbe.initialDelaySeconds }}
            periodSeconds: {{ .Values.readinessProbe.periodSeconds }}
          {{- end }}
          {{- if .Values.livenessProbe.enabled }}
          livenessProbe:
            httpGet:
              path: {{ .Values.livenessProbe.path }}
              port: {{ .Values.containerPort | default .Values.service.port }}
            initialDelaySeconds: {{ .Values.livenessProbe.initialDelaySeconds }}
            periodSeconds: {{ .Values.livenessProbe.periodSeconds }}
          {{- end }}
      {{- with $runtime.volumes }}
      volumes:
        {{- range . }}
        - name: {{ printf "rv-%s" .name | quote }}
          persistentVolumeClaim:
            claimName: {{ default (printf "%s-%s" (trunc 40 $.Release.Name) .name) .claimName | quote }}
        {{- end }}
      {{- end }}
