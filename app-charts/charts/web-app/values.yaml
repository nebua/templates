replicaCount: 1

# Empty = chosen from the volumes: Recreate when a ReadWriteOnce volume is
# mounted, otherwise RollingUpdate that only removes an old pod once a new one
# is ready. Set to override, e.g. {type: Recreate}.
strategy: {}

# Created when replicaCount > 1.
podDisruptionBudget:
  enabled: true
  minAvailable: 1

containerPort: 80

image:
  repository: ""
  tag: ""
  pullPolicy: IfNotPresent

imagePullSecrets: []

# Keep pods off control-plane nodes (required node affinity). Set by NebuaCloud
# when the target cluster has at least one schedulable worker node.
workerNodesOnly: false

registry:
  provider: "github"
  server: ""
  secretName: ""
  username: ""
  token: ""

extraEnv: []

# Like extraEnv ([{name, value}]), but the values go into a Secret named
# "<release>-env" and reach the container through secretKeyRef, so they never
# appear in the Deployment. A name in both lists is taken from here.
secretEnv: []

# Optional container args - override the image's CMD (like a docker-compose
# `command:`), keeping its ENTRYPOINT. Empty = the image's own default.
args: []

# Volumes + init steps from NebuaCloud's Runtime settings: base64 of
# {"volumes":[{name,mountPath,claimName?,shared?,size?,readOnly?,subPath?}],
#  "initSteps":[{name?,image,command?,mounts:[{volume,mountPath,subPath?}]}]}
# (one opaque value, since Argo CD helm parameters can't hold object lists).
runtimeStorage: ""

ingress:
  enabled: true
  className: nginx
  hosts:
    - host: ""
      paths:
        - path: /
          pathType: Prefix
  tls: []

resources:
  limits:
    cpu: 500m
    memory: 512Mi
  requests:
    cpu: 100m
    memory: 128Mi

service:
  type: ClusterIP
  port: 80

# HTTP checks on containerPort. Readiness keeps traffic (and a rolling update)
# off a pod until it answers; liveness restarts a pod that stops answering.
readinessProbe:
  enabled: false
  path: /
  initialDelaySeconds: 5
  periodSeconds: 10
  timeoutSeconds: 3

livenessProbe:
  enabled: false
  path: /
  initialDelaySeconds: 30
  periodSeconds: 30
  timeoutSeconds: 3
