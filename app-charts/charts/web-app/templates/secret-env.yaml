{{- /* Environment variables kept out of the pod spec: the container reads them
     from this Secret (see secretEnv in values.yaml). */}}
{{- if .Values.secretEnv }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ printf "%s-env" .Release.Name | quote }}
  labels:
    app: {{ .Release.Name }}
    # NebuaCloud's app-scoped backups select the app's resources by this label.
    app.kubernetes.io/instance: {{ .Release.Name }}
type: Opaque
stringData:
  {{- range .Values.secretEnv }}
  {{ .name | quote }}: {{ .value | quote }}
  {{- end }}
{{- end }}
