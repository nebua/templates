image:
  registry: docker.io
  repository: mongo
  tag: "7.0"
  pullPolicy: IfNotPresent

auth:
  rootUsername: "root"
  rootPassword: ""
  database: "app"

replicaCount: 1

service:
  port: 27017

persistence:
  enabled: true
  storageClass: "longhorn"
  size: "10Gi"

resources:
  limits:
    cpu: "500m"
    memory: "1Gi"
  requests:
    cpu: "100m"
    memory: "256Mi"

podSecurityContext: {}
containerSecurityContext: {}
nodeSelector: {}
tolerations: []
affinity: {}