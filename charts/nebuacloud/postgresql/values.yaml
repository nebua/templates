image:
  registry: docker.io
  repository: postgres
  tag: "16"
  pullPolicy: IfNotPresent

auth:
  username: "default"
  password: ""
  database: "app"

replicaCount: 1

service:
  port: 5432

persistence:
  enabled: true
  storageClass: "longhorn"
  size: "10Gi"

resources:
  limits:
    cpu: "500m"
    memory: "1Gi"
  requests:
    cpu: "100m"
    memory: "256Mi"

podSecurityContext: {}
containerSecurityContext: {}
nodeSelector: {}
tolerations: []
affinity: {}